[project]
name = "dr-mcp"
# Bei jeder Änderung erhöhen - uvx cached Builds pro Version (siehe README, "uv cache clean").
version = "0.1.0"
description = "MCP-Server für die Digital Republic API (SIM-/eSIM-Verwaltung für Geschäftskunden)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
dr-mcp = "dr_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
