name: Docker Image bauen und veroeffentlichen

# Baut bei jedem Push auf main ein neues Docker-Image und veroeffentlicht es
# auf der GitHub Container Registry (ghcr.io). Portainer zieht das fertige
# Image per "Pull and redeploy" - kein lokaler Build auf dem Docker-Host.
# Vorher laufen die Tests; schlagen sie fehl, wird kein Image veroeffentlicht.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "pyproject.toml"
      - "src/**"
      - "tests/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python aufsetzen
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install ".[test]"

      - name: Tests ausfuehren
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Volle Historie, damit die Patch-Version (Anzahl Commits) stimmt
          fetch-depth: 0

      - name: Version ermitteln
        id: version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"$/\1/p' pyproject.toml)
          count=$(git rev-list --count HEAD -- Dockerfile pyproject.toml src/ .github/workflows/docker-publish.yml)
          test -n "$base" && test -n "$count"
          echo "version=${base}.${count}" >> "$GITHUB_OUTPUT"
          echo "Version: ${base}.${count}"

      - name: Image-Namen in Kleinbuchstaben ermitteln
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx aufsetzen
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
